name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: client
        run: npm install

      - name: Build
        working-directory: client
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDv2HkGMYb_I-05PCzQWLU_GdfeUFq5vRs
          VITE_FIREBASE_AUTH_DOMAIN: shop-erp-9dbac.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: shop-erp-9dbac
          VITE_FIREBASE_STORAGE_BUCKET: shop-erp-9dbac.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "804029698988"
          VITE_FIREBASE_APP_ID: 1:804029698988:web:326394c6337c3187b52009
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
